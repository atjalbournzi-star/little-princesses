  <!-- Global Standard Numerals (123) & Calendar Runtime Engine -->
  <script>
    (function() {
      var arabicDigits = '٠١٢٣٤٥٦٧٨٩';
      function toLatinDigits(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[٠-٩]/g, function(c) {
          var idx = arabicDigits.indexOf(c);
          return idx !== -1 ? idx : c;
        });
      }
      window.toStandardDigits = toLatinDigits;

      // 1. Number toLocaleString
      var _origNumToLocaleString = Number.prototype.toLocaleString;
      Number.prototype.toLocaleString = function(locales, options) {
        var targetLocales = (!locales || (typeof locales === 'string' && locales.startsWith('ar'))) ? 'en-US' : locales;
        var res = _origNumToLocaleString.call(this, targetLocales, options);
        return toLatinDigits(res);
      };

      // 2. Date formatting methods
      var _origDateToLocaleString = Date.prototype.toLocaleDateString;
      Date.prototype.toLocaleDateString = function(locales, options) {
        var targetLocales = locales;
        if (typeof targetLocales === 'string' && targetLocales.startsWith('ar') && targetLocales.indexOf('-u-nu-') === -1) {
          targetLocales = targetLocales + '-u-nu-latn';
        }
        var res = _origDateToLocaleString.call(this, targetLocales || 'ar-YE-u-nu-latn', options);
        return toLatinDigits(res);
      };

      var _origDateToLocaleTimeString = Date.prototype.toLocaleTimeString;
      Date.prototype.toLocaleTimeString = function(locales, options) {
        var targetLocales = locales;
        if (typeof targetLocales === 'string' && targetLocales.startsWith('ar') && targetLocales.indexOf('-u-nu-') === -1) {
          targetLocales = targetLocales + '-u-nu-latn';
        }
        var res = _origDateToLocaleTimeString.call(this, targetLocales || 'ar-YE-u-nu-latn', options);
        return toLatinDigits(res);
      };

      var _origDateToString = Date.prototype.toLocaleString;
      Date.prototype.toLocaleString = function(locales, options) {
        var targetLocales = locales;
        if (typeof targetLocales === 'string' && targetLocales.startsWith('ar') && targetLocales.indexOf('-u-nu-') === -1) {
          targetLocales = targetLocales + '-u-nu-latn';
        }
        var res = _origDateToString.call(this, targetLocales || 'ar-YE-u-nu-latn', options);
        return toLatinDigits(res);
      };

      // 3. Intl.DateTimeFormat
      if (window.Intl && window.Intl.DateTimeFormat) {
        var _OrigDateTimeFormat = window.Intl.DateTimeFormat;
        window.Intl.DateTimeFormat = function(locales, options) {
          var targetLocales = locales;
          if (typeof targetLocales === 'string' && targetLocales.startsWith('ar') && targetLocales.indexOf('-u-nu-') === -1) {
            targetLocales = targetLocales + '-u-nu-latn';
          }
          var formatter = new _OrigDateTimeFormat(targetLocales || 'ar-YE-u-nu-latn', options);
          var origFormat = formatter.format.bind(formatter);
          formatter.format = function(date) {
            return toLatinDigits(origFormat(date));
          };
          if (formatter.formatToParts) {
            var origFormatToParts = formatter.formatToParts.bind(formatter);
            formatter.formatToParts = function(date) {
              var parts = origFormatToParts(date);
              return parts.map(function(p) {
                return { type: p.type, value: toLatinDigits(p.value) };
              });
            };
          }
          return formatter;
        };
        window.Intl.DateTimeFormat.prototype = _OrigDateTimeFormat.prototype;
        window.Intl.DateTimeFormat.supportedLocalesOf = _OrigDateTimeFormat.supportedLocalesOf;
      }

      // 4. HTML5 Date Inputs & Calendar Auto-Enforcer (التقويم القياسي 123)
      function enforceStandardCalendar(el) {
        if (!el || !el.tagName) return;
        var type = el.getAttribute('type');
        if (el.tagName.toLowerCase() === 'input' && (type === 'date' || type === 'datetime-local' || type === 'time' || type === 'month')) {
          if (el.getAttribute('lang') !== 'en-GB') {
            el.setAttribute('lang', 'en-GB');
          }
          if (el.getAttribute('dir') !== 'ltr') {
            el.setAttribute('dir', 'ltr');
          }
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('input[type="date"], input[type="datetime-local"], input[type="time"], input[type="month"]').forEach(enforceStandardCalendar);
      });

      var observer = new MutationObserver(function(mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var m = mutations[i];
          if (m.type === 'childList') {
            for (var j = 0; j < m.addedNodes.length; j++) {
              var node = m.addedNodes[j];
              if (node.nodeType === 1) {
                if (node.tagName.toLowerCase() === 'input') {
                  enforceStandardCalendar(node);
                }
                if (node.querySelectorAll) {
                  var list = node.querySelectorAll('input[type="date"], input[type="datetime-local"], input[type="time"], input[type="month"]');
                  for (var k = 0; k < list.length; k++) {
                    enforceStandardCalendar(list[k]);
                  }
                }
              }
            }
          }
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap');

    body, * {

    }

    body {
      letter-spacing: -0.01em;
      background-color: #FAFAFB;
      color: #25232A;

    /* ── Western Tabular Numerals & Monetary Formatting ── */
    .numeric, .amount, .price, .kpi-value, .tabular-nums, .font-mono, .font-numeric {
      font-family: 'Inter', 'Cairo', sans-serif !important;
      font-feature-settings: "tnum" 1, "lnum" 1;
      font-variant-numeric: tabular-nums;
      direction: ltr;
      display: inline-block;
    }

    /* ── Standard Western Numerals (123) for Date Pickers & Calendar Dropdown ── */
    input[type="date"], input[type="datetime-local"], input[type="time"], input[type="month"] {
      font-family: 'Inter', 'Cairo', sans-serif !important;
      font-feature-settings: "locl" 0, "lnum" 1, "tnum" 1 !important;
      font-variant-numeric: tabular-nums lining-nums !important;
      direction: ltr !important;
      text-align: right;
    }
    input[type="date"]::-webkit-datetime-edit,
    input[type="datetime-local"]::-webkit-datetime-edit,
    input[type="time"]::-webkit-datetime-edit {
      font-family: 'Inter', 'Cairo', sans-serif !important;
      font-feature-settings: "locl" 0, "lnum" 1, "tnum" 1 !important;
      font-variant-numeric: tabular-nums lining-nums !important;
      direction: ltr !important;
    }
    input[type="date"]::-webkit-datetime-edit-fields-wrapper,
    input[type="datetime-local"]::-webkit-datetime-edit-fields-wrapper {
      direction: ltr !important;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.8;
      filter: invert(0.2);
    }
    html.dark input[type="date"]::-webkit-calendar-picker-indicator,
    html.dark input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.8);
    }

    /* ── Hierarchy & Metric Classes ── */
    .currency-symbol {

      font-weight: 500;
      color: #6F6B75;
      margin-right: 0.25rem;
      margin-left: 0.25rem;

    }

    .kpi-title {

    .kpi-number {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.2;
      font-family: 'Inter', 'Cairo', sans-serif !important;
      font-feature-settings: "tnum" 1, "lnum" 1;
      font-variant-numeric: tabular-nums;
      direction: ltr;
      display: inline-block;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    *:focus-visible {
      outline: 2px solid #B0005A;
      outline-offset: 1px;
    }
