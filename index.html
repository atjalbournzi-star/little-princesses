<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👑 Little Princesses ERP - Fashion ERP & Haute Couture SaaS</title>
  
  <!-- Google Fonts: Cairo (Primary Arabic), Tajawal & Inter (Western Numerals & UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Tajawal', 'sans-serif'],
            mono: ['Inter', 'Cairo', 'monospace'],
            numeric: ['Inter', 'Cairo', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#FCE8F2',
              100: '#F8D1E5',
              200: '#F2A4CB',
              500: '#D00070',
              600: '#B0005A', // Primary Magenta
              700: '#8E0049', // Primary Dark
              800: '#700039',
              900: '#52002A',
            },
            purple: {
              50: '#F2E7F3',
              100: '#E5CEE7',
              500: '#A946A0',
              600: '#8F2A87', // Creative Purple
              700: '#73216C',
            },
            teal: {
              50: '#E2F5F7',
              100: '#C5ECF0',
              500: '#19B7C3',
              600: '#009FAE', // Financial Teal
              700: '#007F8C', // Teal Dark
              800: '#00616B',
            },
            orange: {
              50: '#FFF1DC',
              100: '#FFE4B9',
              500: '#FFA126',
              600: '#F28A00', // Operational Orange
              700: '#C97300',
            },
            neutral: {
              canvas: '#FAFAFB',
              surface: '#FFFFFF',
              border: '#E8E5EA',
              title: '#25232A',
              muted: '#6F6B75',
              error: '#D64545',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Env Shim -->
  <script>window.process = { env: { NODE_ENV: 'production' } };</script>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React Global Hooks Shim -->
  <script>
    if (typeof React !== 'undefined') {
      window.useState = React.useState;
      window.useEffect = React.useEffect;
      window.useMemo = React.useMemo;
      window.useCallback = React.useCallback;
      window.useRef = React.useRef;
    }
  </script>

  <!-- Recharts CDN -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap');

    body, * {
      font-family: 'Cairo', 'Tajawal', sans-serif;
    }

    body {
      letter-spacing: -0.01em;
      background-color: #FAFAFB;
      color: #25232A;
    }

    /* ── Western Tabular Numerals & Monetary Formatting ── */
    .numeric, .amount, .price, .kpi-value, .tabular-nums, .font-mono, .font-numeric {
      font-family: 'Inter', 'Cairo', sans-serif !important;
      font-feature-settings: "tnum" 1, "lnum" 1;
      font-variant-numeric: tabular-nums;
    }

    td, th {
      display: table-cell !important;
      vertical-align: middle !important;
    }

    /* ── Hierarchy & Metric Classes ── */
    .currency-symbol {
      font-size: 0.75rem;
      font-weight: 500;
      color: #6F6B75;
      margin-right: 0.25rem;
      margin-left: 0.25rem;
      display: inline-block;
      direction: rtl;
    }

    .kpi-header {
      font-size: 1.5rem;
      font-weight: 700;
      color: #25232A;
    }

    .kpi-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #6F6B75;
    }

    .kpi-number {
      font-size: 1.75rem;
      font-weight: 800;
      line-height: 1.2;
      font-family: 'Inter', 'Cairo', sans-serif !important;
      font-feature-settings: "tnum" 1, "lnum" 1;
      font-variant-numeric: tabular-nums;
      direction: ltr;
      display: inline-block;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    *:focus-visible {
      outline: 2px solid #B0005A;
      outline-offset: 1px;
    }

    /* ── Official Financial Print & PDF Styling ── */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 10mm 15mm 10mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt !important;
      }
      /* Hide all UI navigation and non-print elements */
      aside, header, nav, footer, .sidebar, .mobile-nav, .no-print, button, input, select, .print-hidden {
        display: none !important;
      }
      /* Expand workspace to 100% paper width */
      main, .main-content, #root, div {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        height: auto !important;
        box-shadow: none !important;
        border-color: #e5e7eb !important;
      }
      .print-only {
        display: block !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        page-break-inside: auto !important;
      }
      tr {
        page-break-inside: avoid !important;
        page-break-after: auto !important;
      }
      th, td {
        border: 1px solid #d1d5db !important;
        padding: 6px 10px !important;
        color: #111827 !important;
      }
      th {
        background-color: #f3f4f6 !important;
        font-weight: 700 !important;
      }
      .page-break-avoid {
        page-break-inside: avoid !important;
      }
    }
    @media screen {
      .print-only {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-[#FAFAFB] text-[#25232A] antialiased selection:bg-[#FCE8F2] selection:text-[#B0005A]">
